name: Daily Security Briefing

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send mail now (requires 3 configured mail secrets)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: security-data-update
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/collect.py scripts/briefing.py scripts/email_briefing.py
      - name: Fetch current security intelligence
        run: python scripts/collect.py
      - name: Generate management and technical briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/briefing.py
      - name: Publish new data and briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json briefing.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish daily security briefing"
            git push
          fi
      - name: Send mail (scheduled or explicitly requested)
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_TO: ${{ secrets.BRIEFING_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python scripts/email_briefing.py
